<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 380px; margin: 0; padding: 12px; background: var(--ds-bg-base); color: var(--ds-fg); font-family: system-ui, sans-serif; font-size: 12px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--ds-brand); margin-bottom: 10px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; background: var(--ds-bg-inset); padding: 4px; border-radius: 8px; }
    .tab { flex: 1; text-align: center; padding: 6px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--ds-fg-muted); font-size: 11px; }
    .tab.active { background: var(--ds-bg-hover); color: var(--ds-accent); }
    .pane { display: none; }
    .pane.active { display: block; }
    .srv-card { display: flex; justify-content: space-between; align-items: center; background: var(--ds-bg-inset); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--ds-bg-hover); }
    .skill-card { background: var(--ds-bg-inset); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--ds-bg-hover); }
    .skill-card .nm { color: var(--ds-brand); font-weight: 700; }
    .skill-card .ds { color: var(--ds-fg-muted); font-size: 10px; margin: 2px 0 4px; }
    .skill-card .pr { color: var(--ds-success); font-size: 10px; font-family: monospace; max-height: 32px; overflow: hidden; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--ds-danger); }
    .dot.on { background: var(--ds-success); box-shadow: 0 0 6px var(--ds-success); }
    textarea, input[type=text], select { width: 100%; box-sizing: border-box; background: var(--ds-bg-inset); color: var(--ds-success); border: 1px solid var(--ds-border); border-radius: 6px; padding: 8px; font-family: monospace; font-size: 11px; }
    textarea { height: 160px; }
    input[type=text], select { height: 28px; margin-bottom: 6px; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; }
    .pri { background: var(--ds-accent); color: var(--ds-bg-inset); }
    .sec { background: var(--ds-success); color: var(--ds-bg-inset); }
    .dang { background: var(--ds-danger); color: var(--ds-bg-inset); flex: 0 0 auto; padding: 4px 8px; }
    .mini { background: var(--ds-border); color: var(--ds-fg); flex: 0 0 auto; padding: 4px 8px; }
    .muted { color:var(--ds-fg-muted); font-size:10px; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <div class="hdr">
    <span><span class="ds-ic" data-ic="zap"></span> DeepSeek MCP Studio</span>
    <span id="tot" style="color:var(--ds-success);font-size:11px;">0 tools</span>
  </div>

  <div style="display:flex;gap:6px;margin-bottom:10px;">
    <input type="text" id="token-in" placeholder="Bridge token (from bridge/.bridge-token)" style="margin-bottom:0;" />
    <button class="sec" id="save-token" style="flex:0 0 auto;padding:6px 10px;">Set</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="t-list">Servers</div>
    <div class="tab" id="t-json">JSON</div>
    <div class="tab" id="t-skills">Skills</div>
  </div>

  <div class="pane active" id="p-list">
    <div id="srv-list">Loading MCP servers...</div>
  </div>

  <div class="pane" id="p-json">
    <textarea id="json-ed" spellcheck="false"></textarea>
    <div class="row">
      <button class="pri" id="save-json">Save & Reload Servers</button>
    </div>
  </div>

  <div class="pane" id="p-skills">
    <div class="muted">Type <b>/name</b> in the DeepSeek chat to run a skill. Built-in skills can be overridden by creating one with the same name.</div>
    <input type="text" id="sk-name" placeholder="skill name (e.g. explain) — no spaces" />
    <select id="sk-emoji" title="Icon"></select>
    <input type="text" id="sk-desc" placeholder="short description" />
    <textarea id="sk-prompt" placeholder="Prompt text. Example: Act as a senior engineer and review:"></textarea>
    <div class="row">
      <button class="sec" id="sk-add">Add / Update Skill</button>
    </div>
    <div id="sk-list" style="margin-top:10px;"></div>
  </div>

  <div class="row">
    <button class="sec" id="inj">Inject Active MCPs to Chat</button>
  </div>

  <script src="skills.js"></script>
  <script src="popup.js"></script>
</body>
</html>
